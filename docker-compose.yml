services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swordgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swordgame}
      POSTGRES_DB: ${POSTGRES_DB:-swordgame}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swordgame}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swordgame}:${POSTGRES_PASSWORD:-swordgame}@postgres:5432/${POSTGRES_DB:-swordgame}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-4200}:80'

volumes:
  postgres-data:
